name: Sync Species and Literature

on:
  schedule:
    # Runs once a day at midnight UTC. 
    # (Avoids running too frequently to prevent API rate limits)
    - cron: '0 0 * * *'
  
  # Allows you to also trigger it manually anytime from the GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run species and literature sync
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/fetch-species.mjs
